<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urlaubsplanung</title>
  <meta name="description" content="Urlaube gemeinsam planen: Tagesplan, Kosten, Tickets, Packliste und Essensplaner">
  <meta name="theme-color" content="#2f5241">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Urlaub">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5241'/%3E%3Cpath d='M4 25 L12 12 L16 18 L20 10 L28 25 Z' fill='%23f5efe2'/%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#urlaube" aria-label="Urlaubsplanung – alle Urlaube">
        <svg viewBox="0 0 40 32" aria-hidden="true"><path d="M2 29 L14 9 L20 18 L26 6 L38 29 Z" fill="currentColor"/><path d="M14 9 L17 14 L14 13 L11 14 Z M26 6 L29.5 12 L26 11 L22.5 12 Z" fill="#f5efe2" opacity=".85"/></svg>
        <span>Urlaubsplanung</span>
      </a>
      <div class="trip-switch">
        <select id="tripSwitch" aria-label="Urlaub wählen"></select>
        <span class="sync-wrap"><span id="syncState" class="sync-dot" role="img"></span><span class="sync-label"></span></span>
      </div>
      <label class="edit-toggle" title="Items, Module und Rezepte bearbeiten (nur in diesem Browser)">
        <input type="checkbox" id="editToggle">
        <span class="switch" aria-hidden="true"></span>
        <span class="lbl">Bearbeiten</span>
      </label>
    </div>
    <nav class="tabs" role="tablist">
      <a href="#urlaube" data-tab="urlaube">Urlaube</a>
      <a href="#plan" data-tab="plan">Planung</a>
      <a href="#unterwegs" data-tab="unterwegs">Unterwegs</a>
      <a href="#kosten" data-tab="kosten">Kosten</a>
      <a href="#packliste" data-tab="packliste">Packliste</a>
      <a href="#essen" data-tab="essen">Essen</a>
      <a href="#rezepte" data-tab="rezepte">Rezepte</a>
      <a href="#einstellungen" data-tab="einstellungen" class="tab-icon" aria-label="Einstellungen" title="Einstellungen"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg></a>
    </nav>
    <svg class="ridge" viewBox="0 0 1440 40" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 40 L0 22 L90 8 L170 26 L260 4 L360 24 L450 14 L560 30 L660 6 L760 22 L860 12 L960 28 L1060 2 L1160 24 L1250 14 L1350 26 L1440 10 L1440 40 Z" fill="var(--paper)"/>
    </svg>
  </header>

  <div id="editBanner" class="edit-banner" hidden></div>

  <main id="app">
    <section id="view-urlaube" class="view" hidden></section>
    <section id="view-plan" class="view" hidden></section>
    <section id="view-unterwegs" class="view" hidden></section>
    <section id="view-kosten" class="view" hidden></section>
    <section id="view-packliste" class="view" hidden></section>
    <section id="view-essen" class="view" hidden></section>
    <section id="view-rezepte" class="view" hidden></section>
    <section id="view-einstellungen" class="view" hidden></section>
  </main>

  <footer class="site-footer">
    <p>Urlaube werden in diesem Browser gespeichert und – wenn eingerichtet – verschlüsselt mit deinem privaten Daten-Repo synchronisiert.</p>
  </footer>

  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="data/packliste.js"></script>
  <script src="data/rezepte.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
  <script src="js/urlaub.js"></script>
</body>
</html>
